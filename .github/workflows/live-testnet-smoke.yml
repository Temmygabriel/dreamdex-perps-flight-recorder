name: Live testnet smoke

on:
  workflow_dispatch:
    inputs:
      confirm_live_order:
        description: "Select YES only when you approve one small, real testnet order followed by cancellation."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      symbol:
        description: "Testnet market base asset"
        required: true
        type: choice
        options:
          - BTC
          - ETH
          - XRP
          - SOL
        default: BTC
      side:
        description: "Side of the resting test order"
        required: true
        type: choice
        options:
          - long
          - short
        default: long
      notional_usdso:
        description: "Maximum intended notional in paper USDso (hard limit 25)"
        required: true
        type: choice
        options:
          - "15"
          - "20"
          - "25"
        default: "20"

permissions:
  contents: read

concurrency:
  group: dreamdex-live-testnet-smoke
  cancel-in-progress: false

jobs:
  no-trade:
    name: No transaction requested
    if: inputs.confirm_live_order != 'YES'
    runs-on: ubuntu-latest
    steps:
      - name: Explain safety gate
        run: echo "No transaction was sent. To run the explicitly approved testnet smoke test, select YES and review the symbol, side, and notional."

  live-smoke:
    name: Place, cancel, and verify a small testnet order
    if: inputs.confirm_live_order == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Typecheck before any transaction
        run: npm run typecheck

      - name: Run deterministic tests before any transaction
        run: npm test

      - name: Place one post-only order, then cancel and verify
        env:
          TESTNET_BOT_PRIVATE_KEY: ${{ secrets.TESTNET_BOT_PRIVATE_KEY }}
          TESTNET_OWNER_ADDRESS: ${{ secrets.TESTNET_OWNER_ADDRESS }}
          CONFIRM_LIVE_TEST_ORDER: ${{ inputs.confirm_live_order }}
          SMOKE_SYMBOL: ${{ inputs.symbol }}
          SMOKE_SIDE: ${{ inputs.side }}
          SMOKE_NOTIONAL_USDSO: ${{ inputs.notional_usdso }}
        run: npx tsx src/live-testnet-smoke.ts

      - name: Save execution evidence even if the run fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perps-flight-recorder-live-testnet-receipt
          path: artifacts/live-testnet-smoke.json
          if-no-files-found: ignore
          retention-days: 30
