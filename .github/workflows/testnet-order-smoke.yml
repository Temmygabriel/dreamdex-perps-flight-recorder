name: Perps Stress Lab testnet order smoke

on:
  workflow_dispatch:
    inputs:
      confirm_live_order:
        description: "YES authorizes using existing wallet USDso (and at most a fixed 1.5 USDso Perps-margin top-up if collateral is the only gate), then one capped POST_ONLY order and cancellation on Hideki testnet."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      side:
        description: "Direction for the resting POST_ONLY test order"
        required: true
        type: choice
        options:
          - long
          - short
        default: long

permissions:
  contents: read

concurrency:
  group: perps-stress-lab-order-smoke
  cancel-in-progress: false

jobs:
  safety-stop:
    name: No transaction requested
    if: inputs.confirm_live_order != 'YES'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm that no transaction will be sent
        run: echo "No transaction sent. Re-run manually and select YES only when authorizing the bounded Hideki testnet order lifecycle with the configured wallet_key secret."

  testnet-order:
    name: Use existing USDso, place and cancel one capped order
    if: inputs.confirm_live_order == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages without secrets in the environment
        run: npm install --no-audit --no-fund

      - name: Typecheck the project
        run: npm run typecheck

      - name: Run one bounded Hideki order lifecycle
        env:
          WALLET_KEY: ${{ secrets.wallet_key }}
          CONFIRM_LIVE_TEST_ORDER: ${{ inputs.confirm_live_order }}
          SMOKE_SIDE: ${{ inputs.side }}
        run: npm run testnet:order-smoke

      - name: Upload redacted testnet evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perps-stress-lab-testnet-order-receipt
          path: artifacts/perps-stress-lab-order-smoke.json
          if-no-files-found: warn
          retention-days: 30
