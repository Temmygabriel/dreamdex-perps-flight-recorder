name: Deployed Perps Stress Lab preview smoke check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-api-smoke:
    name: Verify deployed Hideki APIs and security headers
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/read-only-account-risk-check'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      STRESS_LAB_DEPLOYMENT_URL: https://dreamdex-perps-flight-recorde-git-847110-temmygabriels-projects.vercel.app
    steps:
      - name: Check out tested branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed market, book, market-risk and account-risk APIs
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/check-deployment.mjs
